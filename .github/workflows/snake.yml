name: Generate contribution snake

# Renders the Platane/snk contribution animation and publishes it to the
# `output` branch. The README embeds the SVGs from that branch:
#   https://raw.githubusercontent.com/<owner>/<repo>/output/github-contribution-grid-snake.svg
# Everything here runs with the automatic GITHUB_TOKEN — no PAT secret needed.

on:
  schedule:
    # 01:20 UTC daily. Deliberately off the hour to dodge GitHub's scheduler rush.
    - cron: "20 1 * * *"

  # Allow generating it by hand from the Actions tab.
  workflow_dispatch:

  # Re-render when the workflow or the embed changes.
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
      - README.md

permissions:
  contents: write

# Never let two scheduled runs race each other onto the output branch.
concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Render snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # svg-only skips the GIF encoder, so this is the fast path.
          # color_dots takes exactly 5 hex values, lightest (0 commits) first.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=6c11ff&color_dots=ebedf0,d7c4ff,bda4ff,a077ff,6c11ff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=a78bfa&color_dots=161b22,2b1b4d,3f2770,6b45b0,a78bfa

      - name: Publish SVGs to the output branch
        # build_dir is flattened to the branch root, which is what makes the
        # raw.githubusercontent URLs above resolve without a `dist/` prefix.
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
